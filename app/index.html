<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketSmartAI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: #1e293b;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            width: 85%;
            max-width: 500px;
            box-shadow: 0 10px 30px #0002;
        }
        h1 { color: #4f46e5; }
        p { line-height: 1.6; }
        a, button {
            display: inline-block;
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>💰 PocketSmartAI</h1>
        <h2>Your Smart Money Companion</h2>
        <p>Manage your expenses, plan your budget, and make smarter financial decisions.</p>
        <a href="/docs">Explore App Features</a>
        <p>Smart planning starts here!</p>
    </div>
</body>
</html>
