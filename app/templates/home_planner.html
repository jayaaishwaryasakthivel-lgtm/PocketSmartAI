```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PocketSmartAI | Home Planner</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 24px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #eef2ff, #fdf2f8);
    color: #1e293b;
}
.card {
    max-width: 600px;
    margin: 25px auto;
    padding: 28px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 30px #0001;
}
h1 { color: #4f46e5; }
label { display: block; margin-top: 17px; font-weight: bold; }
input, select {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 16px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    background: #4f46e5;
    color: white;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}
.back { color: #4f46e5; text-decoration: none; }
#result {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    background: #f8fafc;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div class="card">
<a class="back" href="/">← Back to Home</a>
<h1>🏡 Home Budget Planner</h1>
<p>Plan your home essentials within your budget.</p>

<form id="plannerForm">
<label>Budget (₹)</label>
<input type="number" id="budget" min="1" required placeholder="Enter your budget">

<label>Room Type</label>
<select id="room_type">
<option>Living Room</option>
<option>Bedroom</option>
<option>Kitchen</option>
<option>Study Room</option>
</select>

<label>Interior Style</label>
<select id="style">
<option>Modern</option>
<option>Minimal</option>
<option>Traditional</option>
<option>Contemporary</option>
</select>

<label>First Item Needed</label>
<input id="item" value="Sofa" required placeholder="Example: Sofa">

<label>Quantity</label>
<input id="quantity" type="number" min="1" max="100" value="1" required>

<button type="submit">✨ Generate My Plan</button>
</form>

<div id="result" hidden></div>
</div>

<script>
document.getElementById("plannerForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const result = document.getElementById("result");
    result.hidden = false;
    result.textContent = "⏳ Creating your plan...";

    const data = {
        budget: Number(document.getElementById("budget").value),
        room_type: document.getElementById("room_type").value,
        style: document.getElementById("style").value,
        items: [{
            name: document.getElementById("item").value,
            quantity: Number(document.getElementById("quantity").value)
        }]
    };

    try {
        const response = await fetch("/generate-home", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            credentials: "same-origin",
            body: JSON.stringify(data)
        });

        const output = await response.json();

        if (!response.ok) {
            result.textContent = "❌ " + (
                typeof output.detail === "string"
                ? output.detail
                : JSON.stringify(output.detail || output)
            );
            return;
        }

        result.textContent = "✅ Your recommendation:\n\n" +
            JSON.stringify(output, null, 2);
    } catch (error) {
        result.textContent = "❌ Connection failed. Please try again.";
    }
});
</script>
</body>
</html>
